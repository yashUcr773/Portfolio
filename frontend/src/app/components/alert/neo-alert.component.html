@if (isVisible) {
  <div [class]="alertClasses" role="alert">
    <div class="neo-alert-icon">{{ icon }}</div>
    
    <div class="neo-alert-content">
      @if (title) {
        <div class="neo-alert-title">{{ title }}</div>
      }
      <div class="neo-alert-message">
        <ng-content></ng-content>
      </div>
    </div>
    
    @if (dismissible) {
      <button class="neo-alert-close" (click)="onDismiss()" aria-label="Dismiss">
        ✕
      </button>
    }
  </div>
}
